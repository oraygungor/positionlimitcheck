<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESMA Position Limits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .sidebar { height: 100vh; overflow-y: auto; border-right: 1px solid #ddd; background: white; }
        .file-item { cursor: pointer; padding: 12px; border-bottom: 1px solid #eee; }
        .file-item:hover { background-color: #f0f0f0; }
        .file-item.active { background-color: #0d6efd; color: white; }
        .diff-updated { background-color: #fff3cd; color: #856404; font-weight: bold; }
        .diff-added { background-color: #d1e7dd; color: #0f5132; }
        .diff-deleted { background-color: #f8d7da; color: #842029; }
        .arrow { color: #dc3545; font-weight: bold; margin: 0 5px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 sidebar p-0">
            <div class="p-3 bg-dark text-white"><h5>Raporlar</h5></div>
            <div id="file-list" class="list-group list-group-flush">
                <div class="p-3 text-muted">Yükleniyor...</div>
            </div>
        </div>

        <div class="col-md-9 col-lg-10 p-4">
            <h3 id="report-title">← Soldan tarih seçin</h3>
            
            <ul class="nav nav-tabs mt-4" id="tabs">
                <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-updates">🛠 Updates <span id="badge-upd" class="badge bg-warning text-dark">0</span></button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-adds">➕ Adds <span id="badge-add" class="badge bg-success">0</span></button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-dels">➖ Deletions <span id="badge-del" class="badge bg-danger">0</span></button></li>
            </ul>

            <div class="tab-content mt-3">
                <div class="tab-pane fade show active" id="tab-updates"><div class="table-responsive"><table class="table table-bordered bg-white" id="tbl-updates"></table></div></div>
                <div class="tab-pane fade" id="tab-adds"><div class="table-responsive"><table class="table table-bordered bg-white" id="tbl-adds"></table></div></div>
                <div class="tab-pane fade" id="tab-dels"><div class="table-responsive"><table class="table table-bordered bg-white" id="tbl-dels"></table></div></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ARTIK CONFIG YOK! DIREKT DOSYA OKUYORUZ.
    
    async function init() {
        const listDiv = document.getElementById('file-list');
        try {
            // 1. Python'ın oluşturduğu listeyi çek
            // Cache sorunu olmasın diye sonuna timestamp ekliyoruz (?t=...)
            const res = await fetch('report_list.json?t=' + new Date().getTime());
            
            if (!res.ok) throw new Error("Dosya listesi (report_list.json) bulunamadı. Python scripti çalıştı mı?");
            
            const files = await res.json();
            
            listDiv.innerHTML = '';
            files.forEach(filename => {
                const dateStr = filename.replace('previousVSlatest-', '').replace('.json', '');
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerText = `📅 ${dateStr}`;
                item.onclick = () => loadReport(filename, item, dateStr);
                listDiv.appendChild(item);
            });
        } catch (err) {
            listDiv.innerHTML = `<div class="p-3 text-danger">${err.message}</div>`;
        }
    }

    async function loadReport(filename, el, dateStr) {
        document.querySelectorAll('.file-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('report-title').innerText = `Rapor: ${dateStr}`;

        const res = await fetch(filename);
        const data = await res.json();

        // Sayıları güncelle
        document.getElementById('badge-upd').innerText = data.summary.updates_count || 0;
        document.getElementById('badge-add').innerText = data.summary.additions_count;
        document.getElementById('badge-del').innerText = data.summary.deletions_count;

        // Tabloları çiz
        renderUpdates(data.updates || []);
        renderSimple(data.additions, 'tbl-adds', 'diff-added');
        renderSimple(data.deletions, 'tbl-dels', 'diff-deleted');
    }

    function renderUpdates(list) {
        const tbl = document.getElementById('tbl-updates');
        tbl.innerHTML = '';
        if(!list.length) { tbl.innerHTML = '<tr><td class="p-3 text-muted">Değişiklik yok.</td></tr>'; return; }

        list.forEach(item => {
            let row = '<tr><td style="width:30%">';
            // Kimlik
            row += `<strong>${item._Identity_MIC || ''}</strong><br><small>${item._Identity_Instrument || ''}</small>`;
            row += '</td><td><ul class="list-unstyled mb-0">';
            
            // Değerler
            for(let [k, v] of Object.entries(item)) {
                if(k.startsWith('_')) continue;
                if(v.includes && v.includes(' -> ')) {
                    const [oldV, newV] = v.split(' -> ');
                    row += `<li><span class="text-muted">${k}:</span> <span class="text-decoration-line-through text-danger">${oldV}</span> <span class="arrow">→</span> <span class="diff-updated px-1 rounded">${newV}</span></li>`;
                } else {
                    row += `<li>${k}: ${v}</li>`;
                }
            }
            row += '</ul></td></tr>';
            tbl.innerHTML += row;
        });
    }

    function renderSimple(list, id, cls) {
        const tbl = document.getElementById(id);
        tbl.innerHTML = '';
        if(!list || !list.length) { tbl.innerHTML = '<tr><td class="p-3 text-muted">Veri yok.</td></tr>'; return; }

        // Header
        const keys = new Set();
        list.forEach(i => Object.keys(i).forEach(k => !k.startsWith('_') && keys.add(k)));
        let head = '<thead class="table-light"><tr>' + [...keys].map(k=>`<th>${k}</th>`).join('') + '</tr></thead>';
        
        let body = '<tbody>';
        list.forEach(item => {
            body += `<tr class="${cls}">` + [...keys].map(k=>`<td>${item[k]||''}</td>`).join('') + '</tr>';
        });
        body += '</tbody>';
        tbl.innerHTML = head + body;
    }

    init();
</script>
</body>
</html>
